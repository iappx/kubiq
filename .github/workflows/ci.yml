name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check that every build file carries the declared version
        run: bash .github/scripts/version.sh check

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the GTK4 and WebKitGTK headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev

      - name: Stand in for the embedded frontend bundle
        shell: bash
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html>\n' > frontend/dist/index.html

      - run: go vet ./core/... .
      - run: go test ./core/...
      - run: go build ./core/... .

  macos-app:
    name: macOS app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI pinned by go.mod
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Configure the frontend environment
        run: cp frontend/.env.example frontend/.env

      - name: Build the app bundle
        run: |
          wails3 task darwin:package
          wails3 task darwin:create:zip

      - name: Start the app and check that it keeps running
        run: |
          open -n bin/release/kubiq.app
          sleep 20
          screencapture -x smoke.png || echo "::warning::screencapture failed"
          if ! pgrep -x kubiq >/dev/null; then
            echo "::error::kubiq exited within 20 seconds of starting"
            log show --last 2m --style compact --predicate 'process == "kubiq"' || true
            exit 1
          fi
          pkill -x kubiq

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kubiq-${{ matrix.os }}
          path: |
            bin/release/kubiq.zip
            smoke.png
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cp .env.example .env
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build-only
