version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  # Assets for these platforms are not generated in this project; without
  # `optional` a missing file makes Task refuse to load the whole Taskfile.
  darwin:
    taskfile: ./build/darwin/Taskfile.yml
    optional: true
  ios:
    taskfile: ./build/ios/Taskfile.yml
    optional: true
  android:
    taskfile: ./build/android/Taskfile.yml
    optional: true

vars:
  APP_NAME: "kubiq"
  BIN_DIR: "bin/release"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  bindings:
    summary: Regenerates the TypeScript bindings for the bound Go services
    cmds:
      - wails3 generate bindings -d frontend/bindings -ts

  setup:hooks:
    summary: Points git at .githooks, whose pre-commit hook writes a VERSION bump into every build file
    cmds:
      - git config core.hooksPath .githooks
      - cmd: chmod +x .githooks/pre-commit
        ignore_error: true

  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"
        vars:
          DEV: '{{.DEV}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"
        vars:
          DEV: '{{.DEV}}'

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
